version: "3.8"

services:
  obscura-supervisor:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.worker
    command: ["serve", "--port", "9222", "--host", "0.0.0.0", "--workers", "4"]
    ports:
      - "9222:9222"
      - "9100:9100"
    environment:
      - OBSCURA_STEALTH=1
      - RUST_LOG=info
      - OBSCURA_METRICS_PORT=9100
      - OBSCURA_CDP_TOKEN=abcdefghijklmnopqrstuvwxyz0123456789
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.45.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      obscura-supervisor:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nats_data:
