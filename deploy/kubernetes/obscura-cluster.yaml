apiVersion: apps/v1
kind: Deployment
metadata:
  name: obscura-next-pool
  labels:
    app: obscura-next
spec:
  replicas: 3
  selector:
    matchLabels:
      app: obscura-next
  template:
    metadata:
      labels:
        app: obscura-next
    spec:
      containers:
        - name: obscura
          image: obscura-next:v0.1.0
          args: ["serve", "--port", "9222", "--host", "0.0.0.0", "--workers", "2"]
          ports:
            - containerPort: 9222
              name: cdp
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /json/version
              port: 9222
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /json/version
              port: 9222
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: obscura-next-service
spec:
  selector:
    app: obscura-next
  ports:
    - protocol: TCP
      port: 9222
      targetPort: 9222
  type: ClusterIP

