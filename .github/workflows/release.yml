name: Release

on:
  # Manual validation cannot publish a release.
  workflow_dispatch:
    inputs:
      windows_only:
        description: Validate only the Windows distribution
        type: boolean
        default: true
      arm64_capture:
        description: Validate capture and disconnect cleanup in a native ARM64 container
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  audit:
    name: Audit release dependencies
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          arguments: --all-features --config deny.toml
          command: check advisories bans licenses sources

  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.arm64_capture
    needs: audit
    strategy:
      fail-fast: false
      matrix:
        # Linux retains glibc 2.35 compatibility. Both macOS architectures must
        # build natively because V8 snapshots are architecture-specific (#290).
        # macos-15-intel remains available until August 2027.
        include: >-
          ${{ fromJSON(inputs.windows_only &&
          '[{"target":"x86_64-pc-windows-msvc","os":"windows-latest","name":"obscura-x86_64-windows"}]' ||
          '[{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-22.04","name":"obscura-x86_64-linux"},
          {"target":"aarch64-unknown-linux-gnu","os":"ubuntu-22.04-arm","name":"obscura-aarch64-linux"},
          {"target":"aarch64-apple-darwin","os":"macos-latest","name":"obscura-aarch64-macos"},
          {"target":"x86_64-apple-darwin","os":"macos-15-intel","name":"obscura-x86_64-macos"},
          {"target":"x86_64-pc-windows-msvc","os":"windows-latest","name":"obscura-x86_64-windows"}]') }}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install stealth build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev llvm-dev

      - name: Configure libclang (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Use one coherent SDK. A hard-coded CommandLineTools include path can
          # mix libc++ headers with the selected Xcode SDK and break BoringSSL.
          XCODE_PATH="$(xcode-select -p)"
          SDK_PATH="$(xcrun --show-sdk-path)"
          echo "SDKROOT=$SDK_PATH" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-isystem $SDK_PATH/usr/include/c++/v1" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$XCODE_PATH/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"

      - name: Configure libclang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build no-render release binary
        run: cargo build --profile release-dist --target ${{ matrix.target }} -p obscura-cli --bins --no-default-features

      - name: Stage no-render release binary
        shell: bash
        run: |
          BIN_DIR=target/${{ matrix.target }}/release-dist
          mkdir -p dist/no-render
          if [ -f "$BIN_DIR/obscura.exe" ]; then
            cp "$BIN_DIR/obscura.exe" "$BIN_DIR/obscura-worker.exe" dist/no-render/
          else
            cp "$BIN_DIR/obscura" "$BIN_DIR/obscura-worker" dist/no-render/
          fi

      - name: Build no-render stealth release binary
        run: cargo build --profile release-dist --target ${{ matrix.target }} -p obscura-cli --bins --no-default-features --features stealth

      - name: Stage no-render stealth release binary
        shell: bash
        run: |
          BIN_DIR=target/${{ matrix.target }}/release-dist
          mkdir -p dist/no-render-stealth
          if [ -f "$BIN_DIR/obscura.exe" ]; then
            cp "$BIN_DIR/obscura.exe" "$BIN_DIR/obscura-worker.exe" dist/no-render-stealth/
          else
            cp "$BIN_DIR/obscura" "$BIN_DIR/obscura-worker" dist/no-render-stealth/
          fi

      - name: Build render-enabled release binary
        run: cargo build --profile release-dist --target ${{ matrix.target }} -p obscura-cli --bins --features render

      - name: Stage default release binary
        shell: bash
        run: |
          BIN_DIR=target/${{ matrix.target }}/release-dist
          mkdir -p dist/default
          if [ -f "$BIN_DIR/obscura.exe" ]; then
            cp "$BIN_DIR/obscura.exe" "$BIN_DIR/obscura-worker.exe" dist/default/
          else
            cp "$BIN_DIR/obscura" "$BIN_DIR/obscura-worker" dist/default/
          fi

      - name: Build render-enabled stealth release binary
        run: cargo build --profile release-dist --target ${{ matrix.target }} -p obscura-cli --bins --features render,stealth

      - name: Stage stealth release binary
        shell: bash
        run: |
          BIN_DIR=target/${{ matrix.target }}/release-dist
          mkdir -p dist/stealth
          if [ -f "$BIN_DIR/obscura.exe" ]; then
            cp "$BIN_DIR/obscura.exe" "$BIN_DIR/obscura-worker.exe" dist/stealth/
          else
            cp "$BIN_DIR/obscura" "$BIN_DIR/obscura-worker" dist/stealth/
          fi

      - name: Smoke test release binaries (V8 snapshot)
        # Run the V8 path once so a release never ships a binary that crashes at
        # isolate init from a mismatched snapshot (issue #290). The data: URL
        # keeps it offline. Every target here is native, so the runner can
        # execute all variants it just built.
        shell: bash
        run: |
          for VARIANT in default stealth no-render no-render-stealth; do
            BIN=dist/$VARIANT/obscura
            [ -f "$BIN.exe" ] && BIN="$BIN.exe"
            "$BIN" fetch "data:text/html,<title>ok</title>" --eval "1+1"
          done
          for VARIANT in default stealth; do
            BIN=dist/$VARIANT/obscura
            [ -f "$BIN.exe" ] && BIN="$BIN.exe"
            "$BIN" fetch "data:text/html,<style>body{margin:0;background:%23123456}</style>" --screenshot smoke.png
            test -s smoke.png
            rm smoke.png
          done
          for VARIANT in no-render no-render-stealth; do
            BIN=dist/$VARIANT/obscura
            [ -f "$BIN.exe" ] && BIN="$BIN.exe"
            if "$BIN" fetch "data:text/html,<title>no-render</title>" --screenshot smoke.png; then
              echo "$VARIANT unexpectedly supports screenshots" >&2
              exit 1
            fi
            test ! -e smoke.png
          done

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          tar czf ${{ matrix.name }}.tar.gz -C dist/default obscura obscura-worker
          tar czf ${{ matrix.name }}-stealth.tar.gz -C dist/stealth obscura obscura-worker
          tar czf ${{ matrix.name }}-no-render.tar.gz -C dist/no-render obscura obscura-worker
          tar czf ${{ matrix.name }}-no-render-stealth.tar.gz -C dist/no-render-stealth obscura obscura-worker

      - name: Package and verify Windows runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/ci/test_package_windows.ps1
          ./scripts/ci/package_windows.ps1 dist/default '${{ matrix.name }}.zip'
          ./scripts/ci/package_windows.ps1 dist/stealth '${{ matrix.name }}-stealth.zip'
          ./scripts/ci/package_windows.ps1 dist/no-render '${{ matrix.name }}-no-render.zip'
          ./scripts/ci/package_windows.ps1 dist/no-render-stealth '${{ matrix.name }}-no-render-stealth.zip'

      - name: Upload packaged binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}-stealth.tar.gz
            ${{ matrix.name }}-no-render.tar.gz
            ${{ matrix.name }}-no-render-stealth.tar.gz
            ${{ matrix.name }}.zip
            ${{ matrix.name }}-stealth.zip
            ${{ matrix.name }}-no-render.zip
            ${{ matrix.name }}-no-render-stealth.zip
          if-no-files-found: error
          retention-days: 1

  capture-arm64:
    name: Native ARM64 capture lifecycle
    if: github.event_name == 'workflow_dispatch' && inputs.arm64_capture
    needs: audit
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: nextest
          fallback: none
      - name: Check native architecture
        run: |
          test "$(uname -m)" = aarch64
          node -e 'if (process.arch !== "arm64") process.exit(1)'
          rustc -Vv
      - name: Install build and diagnostic tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev llvm-dev gdb
      - name: Build render release
        run: cargo build --release -p obscura-cli --bins --features render
      - name: Check native grid redistribution progress
        run: |
          cargo nextest run --manifest-path vendor/taffy/Cargo.toml \
            --target-dir target/taffy-regressions --release --lib \
            -E 'test(track_distribution_)'
      - name: Check fontless capture and disconnect cleanup
        shell: bash
        run: |
          set -euo pipefail
          results_root="$RUNNER_TEMP/native-capture"
          mkdir -p "$results_root"
          git rev-parse HEAD > "$results_root/source.txt"
          sha256sum target/release/obscura target/release/obscura-worker > "$results_root/binaries.sha256"
          baseline_image=h4ckf0r0day/obscura:0.2.6
          runtime_image=gcr.io/distroless/cc-debian12:nonroot
          docker pull --platform linux/arm64 "$baseline_image"
          docker pull --platform linux/arm64 "$runtime_image"
          docker image inspect "$baseline_image" "$runtime_image" > "$results_root/images.json"
          test "$(docker image inspect --format '{{.Architecture}}' "$baseline_image")" = arm64
          test "$(docker image inspect --format '{{.Architecture}}' "$runtime_image")" = arm64
          container=''
          trap 'if [[ -n "$container" ]]; then docker rm -f "$container" >/dev/null 2>&1 || true; fi' EXIT
          capture_status=0
          probe() {
            local label="$1" image="$2" mode="$3"
            local output="$results_root/$label"
            mkdir -p "$output/ready"
            chmod 0777 "$output/ready"
            local mounts=(--volume "$output/ready:/capture")
            if [[ "$mode" == current ]]; then
              mounts+=(--volume "$PWD/target/release/obscura:/obscura:ro")
              mounts+=(--volume "$PWD/target/release/obscura-worker:/obscura-worker:ro")
            fi
            container="obscura-capture-$label"
            docker run --detach --name "$container" --network host \
              --read-only --tmpfs /tmp:rw,size=128m --memory 1g --cpus 3 --pids-limit 256 \
              --env TZ=UTC --entrypoint /obscura "${mounts[@]}" "$image" \
              serve --host 127.0.0.1 --port 0 --workers 1 \
              --ready-file /capture/ready.json --allow-private-network --quiet
            for _ in $(seq 1 300); do
              if [[ -s "$output/ready/ready.json" ]]; then break; fi
              if [[ "$(docker inspect --format '{{.State.Running}}' "$container")" != true ]]; then
                docker logs "$container"
                return 1
              fi
              sleep 0.1
            done
            test -s "$output/ready/ready.json"
            local endpoint engine_pid
            endpoint="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("http://"+d["host"]+":"+str(d["port"]))' "$output/ready/ready.json")"
            engine_pid="$(docker inspect --format '{{.State.Pid}}' "$container")"
            docker inspect "$container" > "$output/container.json"
            set +e
            sudo "$(command -v node)" scripts/ci/capture_lifecycle.mjs \
              "$endpoint" "$engine_pid" "$output/observations"
            capture_status=$?
            set -e
            docker logs "$container" > "$output/server.log" 2>&1
            if [[ "$capture_status" != 0 ]]; then
              sudo timeout 20s gdb --batch -ex 'thread apply all bt 12' \
                -p "$engine_pid" > "$output/native-stacks.txt" 2>&1 || true
            fi
            docker rm -f "$container"
            container=''
          }
          probe baseline "$baseline_image" baseline
          printf '%s\n' "$capture_status" > "$results_root/baseline-exit.txt"
          probe current "$runtime_image" current
          printf '%s\n' "$capture_status" > "$results_root/current-exit.txt"
          test "$capture_status" = 0
      - name: Upload native capture evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-capture
          if-no-files-found: warn
          retention-days: 7

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # This job never checks out or executes repository code. The write token is
      # available only while collecting and publishing the completed artifacts.
      - name: Download packaged binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
