name: Obscura Next CI

on:
  push:
    branches: [main, "obscura-next/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & Verify
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: nextest
          fallback: none

      - name: Build Obscura Next
        run: |
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=2 cargo build --release -p obscura-cli --bins --no-default-features

      - name: Run Crate Unit Tests
        run: |
          cargo nextest run -p obscura-agent -p obscura-isolation -p obscura-supervisor -p obscura-telemetry -p obscura-worker -p obscura-ssrf -p obscura-dom

      - name: Run 33-Stage Obstacle Course Gate
        run: |
          OBSCURA_BIN=./target/release/obscura python3 benchmarks/obstacle-course/run.py --runs 1 --warmup 0

      - name: Run Security Regression Suite
        run: |
          ./scripts/run_security_tests.sh

  f5-adversarial:
    name: F5 Adversarial (Linux)
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: obscura
          POSTGRES_DB: obscura
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Start NATS JetStream
        run: |
          docker run -d --name ci-nats -p 4222:4222 nats:2.10-alpine -js
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/4222) 2>/dev/null && break; sleep 1; done

      - name: Build F5 binaries
        run: |
          cargo build --release -p obscura-worker --bin obscura-runtime-worker
          cargo build --release -p obscura-worker-agent
          cargo build --release -p obscura-scheduler --example adversarial_e2e

      - name: Run F5 adversarial suite
        env:
          DATABASE_URL: postgres://postgres:obscura@127.0.0.1:5432/obscura
          NATS_URL: nats://127.0.0.1:4222
          OBSCURA_SERVICE_BOOTSTRAP_SECRET: phase5-11-integration-secret
          OBSCURA_ALLOW_PRIVATE_NETWORK: "true"
        run: |
          ./target/release/examples/adversarial_e2e

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: f5-adversarial-logs
          path: /tmp/*.log
