name: obscura-runtime-bootstrap-host-test

on:
  workflow_dispatch:
  push:
    branches:
      - codex/android-runtime-bootstrap-repro

permissions:
  contents: read

jobs:
  runtime-bootstrap:
    name: Runtime bootstrap / explicit child-realm failure
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "--cfg obscura_runtime_bootstrap"
    steps:
      - name: Checkout Obscura
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ca-certificates clang cmake libclang-dev libssl-dev llvm-dev \
            pkg-config python3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Force the Android runtime-bootstrap code path
        run: |
          set -euxo pipefail
          cargo test -p obscura-js \
            runtime_bootstrap_child_realms_fail_explicitly \
            -- --nocapture
