<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>mixed float run</title>
  <style>
    html, body { margin: 0; }
    #bar {
      width: 400px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      list-style: none;
      background: #343a40;
    }
    #bar li {
      float: left;
      width: 80px;
      height: 30px;
      background: #087f5b;
    }
    #bar li:nth-child(2) { background: #1971c2; }
    #bar li.search {
      float: right;
      width: 60px;
      background: #e8590c;
    }
  </style>
</head>
<body>
  <ul id="bar">
    <li id="left-one"></li>
    <li id="left-two"></li>
    <li id="right-one" class="search"></li>
  </ul>
</body>
</html>
