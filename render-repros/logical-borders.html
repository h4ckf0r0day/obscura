<!doctype html>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box }
  body { margin: 0; display: flex; gap: 20px; direction: ltr }
  .box { width: 200px; height: 80px; background: #f8f9fa }
  .a { direction: rtl; border-inline-start: 10px solid #e03131; border-block-end: 6px solid #1971c2 }
  .b { direction: rtl; border-right: 4px solid #2f9e44; border-inline-start: 12px solid #862e9c }
  .c { direction: rtl; border-inline-start: 12px solid #c2255c; border-right: 4px solid #0b7285 }
  .d { border-inline: 8px solid #f08c00; border-inline-width: 5px 9px }
</style>
<div class="box a"></div><div class="box b"></div><div class="box c"></div><div class="box d"></div>
