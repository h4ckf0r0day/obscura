<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>inline replaced flow</title>
  <style>
    html, body { margin: 0; }
    .case {
      position: absolute;
      left: 0;
      width: 300px;
      line-height: 0;
    }
    .atomic {
      display: inline-block;
      height: 20px;
      vertical-align: top;
    }
    .lead {
      width: 60px;
      background: #087f5b;
    }
    img {
      width: 40px;
      height: 20px;
      vertical-align: top;
      background: #1971c2;
    }
    .tail {
      width: 70px;
      background: #e8590c;
    }
    #default-inline { top: 0; }
    #authored-block { top: 60px; }
    #authored-block img { display: block; }
    #picture-inline { top: 260px; }
    #picture-block { top: 320px; }
    #picture-block picture { display: block; }
    #transparent-link { top: 420px; width: 240px; }
    #transparent-picture-link { top: 580px; width: 240px; }
    #transparent-link img, #transparent-picture-link img {
      width: 100%;
      height: auto;
      max-width: 100%;
    }
    #decorated-transparent { top: 740px; left: 20px; line-height: normal; }
    #decorated-transparent a {
      background-color: transparent;
      box-shadow: 6px 6px 0 #c92a2a;
    }
    #mixed-padding, #mixed-margin { width: 100px; padding-left: 20px; }
    #mixed-padding { top: 820px; }
    #mixed-margin { top: 900px; }
    #mixed-padding a { background-color: transparent; padding-left: calc(5% + 1px); }
    #mixed-margin a { background-color: transparent; margin-left: calc(5% + 1px); }
    #mixed-padding span { width: 40px; background: #f76707; }
    #mixed-margin span { width: 40px; background: #1098ad; }


    #mixed-cell {
      position: absolute;
      left: 0;
      top: 160px;
      width: 300px;
      border-spacing: 0;
    }
    #mixed-cell table {
      width: 100%;
      border-spacing: 0;
    }
    #mixed-cell td { padding: 0; }
    #mixed-cell .zero {
      width: 0;
      height: 0;
      background: transparent;
    }
    #mixed-cell .rule {
      height: 4px;
      background: #7048e8;
    }
    #mixed-cell center { height: 20px; }
    #mixed-cell .centered {
      width: 100px;
      background: #2b8a3e;
    }
  </style>
</head>
<body>
  <div id="default-inline" class="case"><span class="atomic lead"></span><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSIyMCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjIwIiBmaWxsPSIjMTk3MWMyIi8+PC9zdmc+" alt=""><span class="atomic tail"></span></div>
  <div id="authored-block" class="case"><span class="atomic lead"></span><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSIyMCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjIwIiBmaWxsPSIjMTk3MWMyIi8+PC9zdmc+" alt=""><span class="atomic tail"></span></div>
  <table id="mixed-cell">
    <tr>
      <td>
        <img class="zero" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSIyMCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjIwIiBmaWxsPSIjMTk3MWMyIi8+PC9zdmc+" alt="">
        <table><tr><td class="rule"></td></tr></table>
        <center><span class="atomic centered"></span></center>
      </td>
    </tr>
  </table>
  <div id="picture-inline" class="case"><span class="atomic lead"></span><picture><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSIyMCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjIwIiBmaWxsPSIjMTk3MWMyIi8+PC9zdmc+" alt=""></picture><span class="atomic tail"></span></div>
  <div id="picture-block" class="case"><span class="atomic lead"></span><picture><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSIyMCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjIwIiBmaWxsPSIjMTk3MWMyIi8+PC9zdmc+" alt=""></picture><span class="atomic tail"></span></div>
  <div id="transparent-link" class="case"><a style="background-color:transparent"><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSIyMCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjIwIiBmaWxsPSIjMTk3MWMyIi8+PC9zdmc+" alt=""></a></div>
  <div id="transparent-picture-link" class="case"><a style="background-color:rgba(255,0,0,0)"><picture><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSIyMCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjIwIiBmaWxsPSIjMTk3MWMyIi8+PC9zdmc+" alt=""></picture></a></div>
  <div id="decorated-transparent" class="case"><a><span class="atomic lead"></span></a></div>
  <div id="mixed-padding" class="case"><a><span class="atomic"></span></a></div>
  <div id="mixed-margin" class="case"><a><span class="atomic"></span></a></div>
</body>
</html>
