<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Headed MCP reproduction</title>
<style>
  body { margin: 0; padding: 32px; background: #f3efe7; color: #272520; font: 20px system-ui; }
  button { font: inherit; padding: 12px 20px; width: 180px; height: 56px; }
  #color { width: 160px; height: 120px; margin-top: 24px; background: #b83535; }
  label { display: block; margin-top: 16px; }
  input { width: 240px; height: 40px; font: inherit; }
  #bottom { margin-top: 1400px; }
</style>
<h1>Same-session counter</h1>
<button id="counter" type="button">Count: 0</button>
<div id="color"></div>
<label for="note">Native keyboard input</label>
<input id="note" name="note">
<p id="bottom">Scroll target</p>
<script>
  let count = 0;
  document.getElementById('counter').onclick = function () {
    count += 1;
    this.textContent = 'Count: ' + count;
    document.getElementById('color').style.background = count % 2 ? '#287e47' : '#b83535';
  };
</script>
</html>
