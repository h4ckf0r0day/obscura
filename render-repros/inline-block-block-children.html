<!doctype html>
<meta charset="utf-8">
<style>
body { margin:0 }
.row { line-height:0 }
.panel { display:inline-block; padding:10px; border:2px solid #000; vertical-align:top }
.one { width:80px; height:20px; background:#d02020 }
.two { width:120px; height:30px; background:#2050d0 }
#margins .one { margin-bottom:10px; background:#087f5b }
#margins .two { margin-top:15px; background:#7048e8 }
</style>
<div class=row><span class=panel id=plain>
  <div class=one id=plain-one></div>
  <div class=two id=plain-two></div>
</span></div>
<div class=row><span class=panel id=margins>
  <div class=one id=margin-one></div>
  <div class=two id=margin-two></div>
</span></div>
