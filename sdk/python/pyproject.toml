[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "obscura-next"
version = "0.1.0"
description = "Official Python SDK for the Obscura Next Autonomous Browser Platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Obscura Next Contributors" }]
keywords = ["browser", "headless", "automation", "ai-agents", "scraping", "v8"]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
