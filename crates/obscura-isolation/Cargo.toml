[package]
name = "obscura-isolation"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Runtime isolation policies, security sandboxing, and resource quotas for Obscura Next"

[dependencies]
obscura-ssrf = { path = "../obscura-ssrf" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

