[package]
name = "obscura-worker"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Independent runtime worker and session lifecycle manager for Obscura Next"

[[bin]]
name = "obscura-runtime-worker"
path = "src/bin/worker_main.rs"

[dependencies]
obscura-browser = { path = "../obscura-browser" }
obscura-isolation = { path = "../obscura-isolation" }
obscura-telemetry = { path = "../obscura-telemetry" }
obscura-dom = { path = "../obscura-dom" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
