[package]
name = "obscura-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[build-dependencies]
napi-build = "2"

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
obscura-js = { workspace = true }
serde_json = { workspace = true }
