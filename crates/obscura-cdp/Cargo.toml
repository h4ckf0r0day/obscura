[package]
name = "obscura-cdp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Enable Page.captureScreenshot via obscura-render. Propagates render to
# obscura-browser so Page::screenshot is available.
render = ["obscura-browser/render", "dep:image", "dep:png"]

[dependencies]
obscura-dom = { workspace = true }
obscura-browser = { workspace = true }
obscura-js = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
futures-util = "0.3"
obscura-net = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"], optional = true }
png = { version = "0.18", optional = true }

[target.'cfg(target_env = "gnu")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio-tungstenite = { workspace = true }
futures-util = "0.3"
