[package]
name = "obscura-control-plane"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "Distributed control plane persistence and orchestration for Obscura Next"

[dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
obscura-telemetry = { path = "../obscura-telemetry" }
obscura-ssrf = { path = "../obscura-ssrf" }
url = "2"
sha2 = "0.10"
subtle = "2"
hex = "0.4"

async-nats = "0.38"
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# messaging
