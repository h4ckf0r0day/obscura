[package]
name = "obscura-worker-agent"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "Distributed worker agent bridging NATS dispatch to supervised browser workers"

[[bin]]
name = "obscura-worker-agent"
path = "src/main.rs"

[dependencies]
obscura-control-plane = { path = "../obscura-control-plane" }
obscura-scheduler = { path = "../obscura-scheduler" }
obscura-supervisor = { path = "../obscura-supervisor" }
obscura-worker = { path = "../obscura-worker" }
obscura-telemetry = { path = "../obscura-telemetry" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
async-nats = "0.38"
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
