[package]
name = "obscura-scheduler"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "Distributed job scheduler for Obscura Next"

[dependencies]
obscura-control-plane = { path = "../obscura-control-plane" }
obscura-telemetry = { path = "../obscura-telemetry" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
libc = "0.2"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-nats = "0.38"
